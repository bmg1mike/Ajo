[project]
name = "ajo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "av>=14,<16",
    "fastapi[standard]>=0.143.0",
    "faster-whisper>=1.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-telegram-bot>=22",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a disposable pgvector PostgreSQL database",
    "corpus: ingests the real downloaded corpus with the local embedding model (AJO_CORPUS_TESTS=1)",
    "qa_eval: runs the QA evaluation set against the ingested database and configured LLM (AJO_QA_EVAL=1)",
    "speech: downloads and runs the MMS-TTS and faster-whisper models with ffmpeg (AJO_SPEECH_TESTS=1)",
]

[tool.fastapi]
entrypoint = "app.main:app"
