services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ajo
      POSTGRES_USER: ajo
      POSTGRES_PASSWORD: ajo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajo -d ajo"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
