# Corpus sources for JAMB Biology. Only openly licensed or official public material.
#
# `sections` must match PDF outline (bookmark) titles exactly; each section runs to the
# next outline entry, so end-of-chapter summaries and review questions are excluded.
# `sha256` pins the edition: OpenStax revises PDFs in place, and a new edition can move
# pages, so re-check sections and printed page numbers before updating a checksum.
# A section may set `topic: <code>` to override embedding-based topic mapping after a
# manual spot check (see the ingestion report).
#
# License note: OpenStax now publishes both books under CC BY-NC-SA 4.0 (spec.md lists
# CC BY 4.0). Non-commercial use with attribution is fine for this POC; revisit before
# any commercial use.

x-openstax-line-patterns: &openstax_line_patterns
  - '^(?P<page>\d+) \d+ • .+$'            # even-page footer: "118 5 • Photosynthesis"
  - '^\d+\.\d+ • .+ (?P<page>\d+)$'       # odd-page footer: "5.1 • Overview of Photosynthesis 119"
  - '^Access for free at openstax\.org$'

